<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retentics 인재풀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2a2a2a;
    --border2: #333;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --accent: #00e5a0;
    --accent2: #00b87a;
    --ds: #6366f1;
    --be: #f59e0b;
    --fe: #3b82f6;
    --ai: #ec4899;
    --coffee: #a16207;
    --coffee-light: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── 비밀번호 화면 ── */
  #lock-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .lock-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .lock-logo {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 2rem;
  }
  .lock-icon {
    font-size: 32px;
    margin-bottom: 1rem;
  }
  .lock-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .lock-sub {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .lock-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .lock-input:focus { border-color: var(--accent); }
  .lock-input.error { border-color: #ef4444; animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .lock-btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
  }
  .lock-btn:hover { background: var(--accent2); }
  .lock-error {
    font-size: 12px;
    color: #ef4444;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ── 메인 앱 (처음엔 숨김) ── */
  #app { display: none; }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    background: rgba(15,15,15,0.95);
    backdrop-filter: blur(8px);
    z-index: 100;
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logout-btn {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--text3);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: all 0.15s;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--text3); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .stat-item {
    flex: 1;
    min-width: 110px;
    padding: 1rem 1.25rem;
    border-right: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .stat-item:last-child { border-right: none; }
  .stat-item:hover { background: var(--surface); }
  .stat-item.active { background: var(--surface); }
  .stat-item.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }
  .stat-item.active-ds::after { background: var(--ds); }
  .stat-item.active-be::after { background: var(--be); }
  .stat-item.active-fe::after { background: var(--fe); }
  .stat-item.active-ai::after { background: var(--ai); }
  .stat-item.active-coffee::after { background: var(--coffee-light); }
  .stat-label { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-count { font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
  .stat-sub { font-size: 11px; color: var(--text2); }
  .c-all { color: var(--accent); }
  .c-ds { color: var(--ds); }
  .c-be { color: var(--be); }
  .c-fe { color: var(--fe); }
  .c-ai { color: var(--ai); }
  .c-coffee { color: var(--coffee-light); }

  /* Main layout */
  .main { display: flex; height: calc(100vh - 56px - 73px); }

  /* Sidebar */
  .sidebar { width: 240px; border-right: 1px solid var(--border); padding: 1.25rem; overflow-y: auto; flex-shrink: 0; }
  .sidebar-section { margin-bottom: 1.5rem; }
  .sidebar-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'DM Mono', monospace; margin-bottom: 8px; }
  .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.15s; }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--accent); }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-btn { background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; font-size: 12px; color: var(--text2); cursor: pointer; text-align: left; transition: all 0.12s; font-family: 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: space-between; }
  .filter-btn:hover { background: var(--surface); color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .filter-count { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text3); }

  /* List */
  .list-panel { flex: 1; overflow-y: auto; padding: 1.25rem; }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .list-count { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .candidate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .candidate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
  .candidate-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .candidate-card.role-ds::before { background: var(--ds); }
  .candidate-card.role-be::before { background: var(--be); }
  .candidate-card.role-fe::before { background: var(--fe); }
  .candidate-card.role-ai::before { background: var(--ai); }
  .candidate-card:hover { border-color: var(--border2); background: var(--surface2); transform: translateY(-1px); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .candidate-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .role-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-family: 'DM Mono', monospace; flex-shrink: 0; }
  .badge-ds { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .badge-be { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .badge-fe { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .badge-ai { background: rgba(236,72,153,0.15); color: #f9a8d4; }
  .badge-coffee { background: rgba(245,158,11,0.12); color: #fde68a; }
  .candidate-card.role-coffee::before { background: var(--coffee-light); }

  /* 커피챗 전용 카드 스타일 */
  .coffee-schedule { font-size: 11px; color: var(--text2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.6; }
  .coffee-schedule .schedule-row { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 3px; }
  .coffee-schedule .schedule-icon { flex-shrink: 0; }
  .coffee-done { color: var(--accent2); }
  .coffee-pending { color: #f59e0b; }
  .source-coffee { background: rgba(245,158,11,0.1); color: #fde68a; font-size: 10px; padding: 2px 7px; border-radius: 3px; font-family: 'DM Mono', monospace; }
  .card-meta { display: flex; flex-direction: column; gap: 5px; }
  .meta-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .meta-icon { width: 14px; text-align: center; color: var(--text3); font-size: 11px; }
  .source-tag { font-size: 10px; padding: 2px 7px; border-radius: 3px; font-family: 'DM Mono', monospace; }
  .source-tally { background: rgba(0,229,160,0.1); color: var(--accent2); }
  .source-field { background: rgba(255,255,255,0.05); color: var(--text3); }
  .source-linkedin { background: rgba(59,130,246,0.1); color: #93c5fd; }
  .src-parent { font-weight: 500; color: var(--text) !important; margin-top: 4px; }
  .src-child { padding-left: 18px !important; font-size: 11px !important; }
  .avail-tag { font-size: 10px; padding: 2px 7px; border-radius: 3px; }
  .avail-now { background: rgba(0,229,160,0.1); color: var(--accent); }
  .avail-later { background: rgba(255,255,255,0.05); color: var(--text3); }
  .memo-text { font-size: 11px; color: var(--text3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.5; }

  /* Detail panel */
  .detail-panel { width: 300px; border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: none; }
  .detail-panel.open { display: block; }
  .detail-header { padding: 1.25rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .detail-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; float: right; margin-top: -2px; }
  .detail-close:hover { color: var(--text); }
  .detail-name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .detail-body { padding: 1.25rem; }
  .detail-section { margin-bottom: 1.5rem; }
  .detail-section-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'DM Mono', monospace; margin-bottom: 10px; }
  .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 12px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { color: var(--text3); flex-shrink: 0; }
  .detail-val { color: var(--text); text-align: right; word-break: break-all; }
  .detail-val a { color: var(--accent); text-decoration: none; }
  .detail-val a:hover { text-decoration: underline; }
  .memo-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 13px; color: var(--text2); line-height: 1.6; }
  .empty { text-align: center; padding: 4rem 2rem; color: var(--text3); font-size: 13px; grid-column: 1 / -1; }
  .loading { text-align: center; padding: 4rem; color: var(--text3); font-family: 'DM Mono', monospace; font-size: 12px; grid-column: 1 / -1; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-logo">RETENTICS</div>
    <div class="lock-icon">🔒</div>
    <div class="lock-title">인재풀 접근</div>
    <div class="lock-sub">내부 인원만 접근 가능한 페이지입니다.<br>비밀번호를 입력해주세요.</div>
    <input class="lock-input" type="password" id="pw-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="lock-btn" onclick="checkPw()">입장하기</button>
    <div class="lock-error" id="pw-error"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <header class="header">
    <div class="logo">RETENTICS / TALENT POOL</div>
    <button class="logout-btn" onclick="logout()">잠금 🔒</button>
  </header>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-item active" onclick="setFilter('all',this)">
      <div class="stat-label">전체</div>
      <div class="stat-count c-all" id="cnt-all">—</div>
      <div class="stat-sub">명</div>
    </div>
    <div class="stat-item" onclick="setFilter('ds',this)">
      <div class="stat-label">Data Scientist</div>
      <div class="stat-count c-ds" id="cnt-ds">—</div>
      <div class="stat-sub">명</div>
    </div>
    <div class="stat-item" onclick="setFilter('be',this)">
      <div class="stat-label">Backend</div>
      <div class="stat-count c-be" id="cnt-be">—</div>
      <div class="stat-sub">명</div>
    </div>
    <div class="stat-item" onclick="setFilter('fe',this)">
      <div class="stat-label">Frontend</div>
      <div class="stat-count c-fe" id="cnt-fe">—</div>
      <div class="stat-sub">명</div>
    </div>
    <div class="stat-item" onclick="setFilter('ai',this)">
      <div class="stat-label">AI Engineer</div>
      <div class="stat-count c-ai" id="cnt-ai">—</div>
      <div class="stat-sub">명</div>
    </div>
    <div class="stat-item" onclick="setFilter('coffee',this)">
      <div class="stat-label">☕ 커피챗</div>
      <div class="stat-count c-coffee" id="cnt-coffee">—</div>
      <div class="stat-sub">명</div>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">검색</div>
        <input class="search-input" type="text" placeholder="이름, 메모 검색..." id="search-input" oninput="renderList()">
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">포지션</div>
        <div class="filter-group">
          <button class="filter-btn active" data-avail="all" onclick="setAvail('all',this)"><span>전체</span><span class="filter-count" id="avail-all">—</span></button>
          <button class="filter-btn" data-avail="ds" onclick="setAvail('ds',this)"><span>🔬 Data Scientist</span><span class="filter-count" id="avail-ds">—</span></button>
          <button class="filter-btn" data-avail="be" onclick="setAvail('be',this)"><span>⚙️ Backend</span><span class="filter-count" id="avail-be">—</span></button>
          <button class="filter-btn" data-avail="fe" onclick="setAvail('fe',this)"><span>🖥️ Frontend</span><span class="filter-count" id="avail-fe">—</span></button>
          <button class="filter-btn" data-avail="ai" onclick="setAvail('ai',this)"><span>🤖 AI Engineer</span><span class="filter-count" id="avail-ai">—</span></button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">출처</div>
        <div class="filter-group">
          <button class="filter-btn active" data-src="all" onclick="setSrc('all',this)"><span>전체</span></button>
          <!-- 그룹바이 채용 박람회 (상위) -->
          <button class="filter-btn src-parent" data-src="groupby" onclick="setSrc('groupby',this)"><span>📋 그룹바이 채용 박람회</span></button>
          <!-- 그룹바이 하위 항목 -->
          <button class="filter-btn src-child" data-src="Tally" onclick="setSrc('Tally',this)"><span>└ Tally 인재풀</span></button>
          <button class="filter-btn src-child" data-src="현장" onclick="setSrc('현장',this)"><span>└ 현장 Waiting List</span></button>
          <!-- 링크드인 아웃바운드 (독립 섹션) -->
          <button class="filter-btn src-parent" data-src="linkedin" onclick="setSrc('linkedin',this)"><span>🔗 링크드인 아웃바운드</span></button>
        </div>
      </div>
    </aside>

    <div class="list-panel">
      <div class="list-header">
        <div class="list-count" id="list-count">로딩 중...</div>
      </div>
      <div class="candidate-grid" id="candidate-grid">
        <div class="loading">데이터 불러오는 중...</div>
      </div>
    </div>

    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="role-badge" id="detail-badge" style="margin-bottom:8px;display:inline-block"></div>
        <div class="detail-name" id="detail-name"></div>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>
</div>

<script>
// ── 비밀번호 설정 (여기서 변경하세요) ──
const PASSWORD = 'retentics2026';

// ── 구글 시트 설정 ──
const SHEET_ID = '1P2dzqxERIycwFmd76WJMUWG99J3ojgukvgC3ZtSy5QA';

// 일반 후보 시트 (11컬럼: No,이름,연락처,이메일,경력,지원시기,출처,이력서,면접단계,결과,메모)
const CANDIDATE_SHEETS = [
  { name: 'Data Scientist', role: 'ds', label: 'DS' },
  { name: '백엔드',          role: 'be', label: 'BE' },
  { name: '프론트엔드',      role: 'fe', label: 'FE' },
  { name: 'AI 엔지니어',     role: 'ai', label: 'AI' },
];
const CANDIDATE_COLS = ['no','name','phone','email','exp','avail','source','resume','interview','result','memo'];

// 커피챗 시트 (10컬럼: No,이름,포지션,연락처,이메일,링크드인,노션미팅노트,출처,1차커피챗,2차커피챗)
const COFFEE_SHEET = { name: '커피챗', role: 'coffee', label: '☕' };
const COFFEE_COLS  = ['no','name','position','phone','email','linkedin','note','source','coffee1','coffee2'];

let allCandidates  = [];
let coffeeCandidates = [];
let activeFilter   = 'all';
let activeAvail    = 'all';
let activeSrc      = 'all';

// ── 비밀번호 로직 ──
function checkPw() {
  const val   = document.getElementById('pw-input').value;
  const errEl = document.getElementById('pw-error');
  if (val === PASSWORD) {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('auth', '1');
    loadAll();
  } else {
    errEl.textContent = '비밀번호가 올바르지 않습니다.';
    const input = document.getElementById('pw-input');
    input.classList.add('error');
    input.value = '';
    setTimeout(() => input.classList.remove('error'), 400);
  }
}

function logout() {
  sessionStorage.removeItem('auth');
  document.getElementById('app').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
}

if (sessionStorage.getItem('auth') === '1') {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
}

// ── 데이터 로딩 ──
async function fetchCandidateSheet(sheet) {
  const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet.name)}&range=A3:K60`;
  try {
    const res  = await fetch(csvUrl);
    const text = await res.text();
    return parseCandidateCSV(text, sheet);
  } catch(e) { return []; }
}

async function fetchCoffeeSheet() {
  const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(COFFEE_SHEET.name)}&range=A2:J50`;
  try {
    const res  = await fetch(csvUrl);
    const text = await res.text();
    return parseCoffeeCSV(text);
  } catch(e) { return []; }
}

function parseCandidateCSV(text, sheet) {
  const lines   = text.trim().split('\n');
  const results = [];
  for (const line of lines) {
    const cols = parseCSVLine(line);
    const no   = cols[0]?.trim().replace(/"/g,'');
    if (!no || isNaN(parseInt(no))) continue;
    const obj  = {};
    CANDIDATE_COLS.forEach((k,i) => obj[k] = (cols[i]||'').trim().replace(/^"|"$/g,''));
    obj.role      = sheet.role;
    obj.roleLabel = sheet.label;
    obj.roleName  = sheet.name;
    obj.id        = sheet.role + '_' + no;
    obj.isCoffee  = false;
    results.push(obj);
  }
  return results;
}

function parseCoffeeCSV(text) {
  const lines   = text.trim().split('\n');
  const results = [];
  for (const line of lines) {
    const cols = parseCSVLine(line);
    const no   = cols[0]?.trim().replace(/"/g,'');
    if (!no || isNaN(parseInt(no))) continue;
    const obj  = {};
    COFFEE_COLS.forEach((k,i) => obj[k] = (cols[i]||'').trim().replace(/^"|"$/g,''));
    obj.role      = 'coffee';
    obj.roleLabel = '☕';
    obj.roleName  = '커피챗';
    obj.id        = 'coffee_' + no;
    obj.isCoffee  = true;
    // 커피챗은 source가 항상 '커피챗'으로 표시
    obj.source    = '커피챗';
    obj.exp       = '';
    obj.avail     = '';
    obj.resume    = '';
    obj.interview = '';
    obj.result    = '';
    obj.memo      = obj.note || '';
    results.push(obj);
  }
  return results;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

async function loadAll() {
  document.getElementById('candidate-grid').innerHTML = '<div class="loading">데이터 불러오는 중...</div>';

  const [candidateResults, coffeeResults] = await Promise.all([
    Promise.all(CANDIDATE_SHEETS.map(fetchCandidateSheet)),
    fetchCoffeeSheet(),
  ]);

  allCandidates    = candidateResults.flat();
  coffeeCandidates = coffeeResults;

  updateCounts();
  renderList();
}

function getAllVisible() {
  return [...allCandidates, ...coffeeCandidates];
}

function updateCounts() {
  const all = getAllVisible();
  document.getElementById('cnt-all').textContent    = all.length;
  document.getElementById('cnt-ds').textContent     = allCandidates.filter(c=>c.role==='ds').length;
  document.getElementById('cnt-be').textContent     = allCandidates.filter(c=>c.role==='be').length;
  document.getElementById('cnt-fe').textContent     = allCandidates.filter(c=>c.role==='fe').length;
  document.getElementById('cnt-ai').textContent     = allCandidates.filter(c=>c.role==='ai').length;
  document.getElementById('cnt-coffee').textContent = coffeeCandidates.length;

  // 포지션 필터 카운트
  document.getElementById('avail-all').textContent = all.length;
  document.getElementById('avail-ds').textContent  = allCandidates.filter(c=>c.role==='ds').length;
  document.getElementById('avail-be').textContent  = allCandidates.filter(c=>c.role==='be').length;
  document.getElementById('avail-fe').textContent  = allCandidates.filter(c=>c.role==='fe').length;
  document.getElementById('avail-ai').textContent  = allCandidates.filter(c=>c.role==='ai').length;
}

function getFiltered() {
  const q    = document.getElementById('search-input').value.toLowerCase().trim();
  const all  = getAllVisible();

  return all.filter(c => {
    if (activeFilter !== 'all' && c.role !== activeFilter) return false;

    // 포지션 필터 (사이드바)
    if (activeAvail !== 'all') {
      if (c.isCoffee) return false;
      if (c.role !== activeAvail) return false;
    }

    // 출처 필터
    if (activeSrc !== 'all') {
      if (activeSrc === 'groupby') {
        // 그룹바이 = Tally + 현장 모두 포함
        if (!c.source.includes('Tally') && !c.source.includes('현장')) return false;
      } else if (activeSrc === 'linkedin') {
        // 링크드인 아웃바운드 = 커피챗
        if (!c.isCoffee) return false;
      } else {
        if (!c.source.includes(activeSrc)) return false;
      }
    }

    // 검색: 이름, 메모, 이메일, 링크드인(커피챗)
    if (q) {
      const searchable = [c.name, c.memo, c.email, c.linkedin||''].join(' ').toLowerCase();
      if (!searchable.includes(q)) return false;
    }

    return true;
  });
}

function renderList() {
  const filtered = getFiltered();
  const grid     = document.getElementById('candidate-grid');
  document.getElementById('list-count').textContent = `${filtered.length}명`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">조건에 맞는 후보가 없습니다</div>';
    return;
  }

  grid.innerHTML = filtered.map(c => {
    if (c.isCoffee) return renderCoffeeCard(c);
    return renderCandidateCard(c);
  }).join('');
}

function renderCandidateCard(c) {
  const isNow   = c.avail.includes('즉시');
  const isTally = c.source.includes('Tally');
  return `
  <div class="candidate-card role-${c.role}" onclick="openDetail('${c.id}')">
    <div class="card-top">
      <div><div class="candidate-name">${c.name}</div></div>
      <span class="role-badge badge-${c.role}">${c.roleLabel}</span>
    </div>
    <div class="card-meta">
      <div class="meta-row">
        <span class="meta-icon">⏱</span>
        <span>${c.exp || '—'}</span>
        ${c.avail ? `<span class="avail-tag ${isNow?'avail-now':'avail-later'}">${isNow?'즉시':c.source.includes('현장')?'현장대기':'1~2개월'}</span>` : ''}
      </div>
      ${c.email ? `<div class="meta-row"><span class="meta-icon">✉</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">${c.email}</span></div>` : ''}
      <div class="meta-row">
        <span class="source-tag ${isTally?'source-tally':'source-field'}">${isTally?'Tally':'현장'}</span>
        ${c.resume ? `<span style="font-size:11px;color:#555">📎 이력서</span>` : ''}
      </div>
    </div>
    ${c.memo ? `<div class="memo-text">${c.memo}</div>` : ''}
  </div>`;
}

function renderCoffeeCard(c) {
  const has1 = c.coffee1 && c.coffee1 !== '—';
  const has2 = c.coffee2 && c.coffee2 !== '—';
  const isPending2 = has2 && c.coffee2.includes('조율');
  // 커피챗 시트의 포지션 컬럼 활용 (없으면 '데이터 사이언티스트' 기본값)
  const posLabel = c.position || c.note || '데이터 사이언티스트';

  return `
  <div class="candidate-card role-coffee" onclick="openDetail('${c.id}')">
    <div class="card-top">
      <div>
        <div style="font-size:10px;color:var(--text3);margin-bottom:3px;font-family:'DM Mono',monospace">${posLabel}</div>
        <div class="candidate-name">${c.name}</div>
      </div>
      <span class="role-badge badge-coffee">☕</span>
    </div>
    <div class="card-meta">
      ${c.phone && c.phone !== '—' ? `<div class="meta-row"><span class="meta-icon">✉</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">${c.phone}</span></div>` : ''}
      <div class="meta-row">
        <span class="source-linkedin">링크드인 아웃바운드</span>
      </div>
    </div>
    <div class="coffee-schedule">
      ${has1 ? `<div class="schedule-row"><span class="schedule-icon">☕</span><span class="coffee-done">1차: ${c.coffee1}</span></div>` : '<div class="schedule-row"><span class="schedule-icon">☕</span><span style="color:var(--text3)">1차 일정 미정</span></div>'}
      ${has2 ? `<div class="schedule-row"><span class="schedule-icon">☕</span><span class="${isPending2?'coffee-pending':'coffee-done'}">2차: ${c.coffee2}</span></div>` : ''}
    </div>
  </div>`;
}

function openDetail(id) {
  const all = getAllVisible();
  const c   = all.find(x => x.id === id);
  if (!c) return;

  document.getElementById('detail-badge').className   = `role-badge badge-${c.role}`;
  document.getElementById('detail-badge').textContent = c.roleName;
  document.getElementById('detail-name').textContent  = c.name;

  let rows;
  if (c.isCoffee) {
    rows = [
      ['연락처',     c.phone   || '—'],
      ['이메일',     c.email && c.email !== '—' ? `<a href="mailto:${c.email}">${c.email}</a>` : '—'],
      ['링크드인',   c.linkedin ? `<a href="${c.linkedin}" target="_blank">프로필 보기</a>` : '—'],
      ['1차 커피챗', c.coffee1 || '—'],
      ['2차 커피챗', c.coffee2 || '—'],
    ].map(([k,v]) => `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  } else {
    rows = [
      ['경력',     c.exp    || '—'],
      ['연락처',   c.phone  || '—'],
      ['이메일',   c.email  ? `<a href="mailto:${c.email}">${c.email}</a>` : '—'],
      ['지원 희망', c.avail || (c.source.includes('현장') ? '현장 대기' : '—')],
      ['출처',     c.source || '—'],
      ['이력서',   c.resume && c.resume !== '이력서 첨부됨' ? `<a href="${c.resume}" target="_blank">링크 열기</a>` : (c.resume || '없음')],
      ['면접 단계', c.interview || '—'],
      ['최종 결과', c.result    || '—'],
    ].map(([k,v]) => `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('');
  }

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-label">기본 정보</div>
      ${rows}
    </div>
    ${c.memo ? `<div class="detail-section"><div class="detail-section-label">메모</div><div class="memo-box">${c.memo}</div></div>` : ''}
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() { document.getElementById('detail-panel').classList.remove('open'); }

function setFilter(val, el) {
  activeFilter = val;
  document.querySelectorAll('#stats-bar .stat-item').forEach(e => e.classList.remove('active','active-ds','active-be','active-fe','active-ai','active-coffee'));
  el.classList.add('active');
  if (val !== 'all') el.classList.add('active-' + val);
  renderList();
}
function setAvail(val, el) {
  activeAvail = val;
  document.querySelectorAll('[data-avail]').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderList();
}
function setSrc(val, el) {
  activeSrc = val;
  document.querySelectorAll('[data-src]').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderList();
}
</script>
